{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge"><title>{% block title %}Threat Desk{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body><header><a class="brand" href="{% url 'dashboard' %}">Threat Desk</a>
<a class="nav" href="{% url 'vulnerabilities' %}">Vulnerabilities</a>
<a class="nav" href="{% url 'merged' %}">Merged records</a>
<form action="{% url 'search' %}" method="get" role="search">
<input name="q" value="{{ q|default:'' }}" placeholder="Search URL, domain, IP, hash, CVE or keyword" aria-label="Search threats">
<button>Search</button></form></header>
<main>{% block content %}{% endblock %}</main>
<footer>Data: ctidigest.com feed in MongoDB. Indicator lookups open VirusTotal.</footer></body></html>
