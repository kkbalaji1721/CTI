# Usage:  docker compose up --build        (first start takes ~1-2 min: Cassandra is slow to boot)
# The "lab" container waits for all 3 databases, then runs every lab task and prints the results.
services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"   # Neo4j browser (optional, for screenshots)
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  lab:
    # Replace YOUR_DOCKERHUB_USERNAME after you push (see README). 'build' lets it work locally too.
    image: YOUR_DOCKERHUB_USERNAME/nosql-lab16:latest
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      CASSANDRA_HOSTS: cassandra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
    volumes:
      - ./output:/app/output
