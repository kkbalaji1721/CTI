services:
  mongo:
    image: mongo:7
  cassandra:
    image: cassandra:4.1
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=none
  app:
    build: .
    image: ${DOCKER_USER:-yourname}/threat-lab:latest
    depends_on: [mongo, cassandra, neo4j]
    environment:
      - N_THREATS=100000
      - DOCKER_URL=${DOCKER_URL:-https://hub.docker.com/r/yourname/threat-lab}
    volumes:
      - ./output:/output
