# StatefulSet: 3 replicas, one PVC each, keyFile auth.
# The keyfile lives in a Secret (mongo-keyfile) so ALL pods share the SAME key.
# An InitContainer copies it to an emptyDir with owner 999 (mongodb) and mode 400,
# because mongod refuses keyfiles that are group/world readable and Secret mounts can't be chown'ed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo-headless-svc
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: keyfile-init
          image: mongo:7
          command: ["bash", "-c"]
          args:
            - cp /keyfile-secret/keyfile /etc/mongodb/keyfile &&
              chown 999:999 /etc/mongodb/keyfile &&
              chmod 400 /etc/mongodb/keyfile
          volumeMounts:
            - { name: keyfile-secret, mountPath: /keyfile-secret, readOnly: true }
            - { name: keyfile, mountPath: /etc/mongodb }
      containers:
        - name: mongo
          image: mongo:7
          # "args" (not "command") so the image's entrypoint still drops privileges to user mongodb
          args: ["--replSet", "rs0", "--bind_ip", "0.0.0.0", "--auth", "--keyFile", "/etc/mongodb/keyfile"]
          ports:
            - { containerPort: 27017, name: mongodb }
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: keyfile, mountPath: /etc/mongodb }
      volumes:
        - name: keyfile
          emptyDir: {}
        - name: keyfile-secret
          secret:
            secretName: mongo-keyfile
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
