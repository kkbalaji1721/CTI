# Headless Service: gives each pod a stable DNS name
#   mongo-0.mongo-headless-svc, mongo-1.mongo-headless-svc, mongo-2.mongo-headless-svc
apiVersion: v1
kind: Service
metadata:
  name: mongo-headless-svc
  labels: { app: mongo }
spec:
  clusterIP: None
  selector: { app: mongo }
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
